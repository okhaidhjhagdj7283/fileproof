<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore — FileProof</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topnav">
  <a class="nav-logo" href="/"><div class="nav-pip"></div>FileProof</a>
  <div class="nav-links">
    <a href="/verify.html" class="nav-hide-mobile text-muted text-sm">Verify</a>
    <a href="/create.html" class="btn btn-primary btn-sm">Tạo Proof</a>
    <div id="nav-user" style="display:flex;gap:8px;align-items:center"></div>
    <button class="nav-mobile-menu" id="nav-menu-btn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</nav>

<!-- Search bar -->
<div style="border-bottom:1px solid var(--border);background:var(--surface);padding:14px 20px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <h1 style="font-size:17px;font-weight:500">Explore Proofs</h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="sort-btn active" data-sort="newest" onclick="setSort('newest')">Mới nhất</button>
      <button class="sort-btn" data-sort="useful" onclick="setSort('useful')">Hữu ích nhất</button>
      <button class="sort-btn" data-sort="discussed" onclick="setSort('discussed')">Nhiều bình luận</button>
      <button class="sort-btn" data-sort="views" onclick="setSort('views')">Nhiều lượt xem</button>
    </div>
  </div>
  <div class="explore-bar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <input type="text" id="search-input" placeholder="Tìm kiếm proof…" style="flex:1;min-width:160px" onkeydown="if(event.key==='Enter')search()">
    <select id="cat-filter" style="width:180px;flex-shrink:0" onchange="search()">
      <option value="">Tất cả danh mục</option>
      <option>Disaster report</option>
      <option>Legal document</option>
      <option>Research</option>
      <option>Journalism</option>
      <option>Community report</option>
      <option>Personal record</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="search()" style="flex-shrink:0">Tìm</button>
  </div>
</div>

<div id="proof-grid" class="proof-grid" style="min-height:300px">
  <div style="grid-column:1/-1;padding:60px;text-align:center">
    <div class="spinner" style="margin:0 auto"></div>
  </div>
</div>

<div style="padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:6px;flex-wrap:wrap" id="pagination"></div>

<script src="/js/app.js"></script>
<script>
let currentPage = 1;
let currentSort = 'newest';

function setSort(s) {
  currentSort = s;
  qsa('[data-sort]').forEach(b => b.classList.toggle('active', b.dataset.sort === s));
  search();
}

async function search(page = 1) {
  currentPage = page;
  const q = el('search-input').value.trim();
  const cat = el('cat-filter').value;
  let url = `/proofs?page=${page}&limit=18&sort=${currentSort}`;
  if (q) url += `&search=${encodeURIComponent(q)}`;
  if (cat) url += `&category=${encodeURIComponent(cat)}`;

  el('proof-grid').innerHTML = `<div style="grid-column:1/-1;padding:60px;text-align:center"><div class="spinner" style="margin:0 auto"></div></div>`;

  try {
    const data = await api(url);
    if (!data.proofs.length) {
      el('proof-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">🔍</div><p>Không tìm thấy proof nào.</p><a href="/create.html" class="btn btn-primary btn-sm">Tạo proof đầu tiên</a></div>`;
      el('pagination').innerHTML = ''; return;
    }

    el('proof-grid').innerHTML = data.proofs.map(p => `
      <div class="proof-grid-item" onclick="location.href='/proof.html?id=${escapeHtml(p.id)}'">
        <div class="proof-thumb">${fileIcon(p.file_type)}</div>
        <div class="proof-thumb-title">${escapeHtml(p.title)}</div>
        <div class="proof-thumb-meta">${escapeHtml(p.file_type?.split('/')[1]||'file')} · ${formatBytes(p.file_size)}</div>
        <div class="mt-1" style="display:flex;align-items:center;justify-content:space-between">
          <span class="badge badge-green" style="font-size:10px"><span class="badge-pip"></span>Verified</span>
          <span class="text-xs text-muted">${timeAgo(p.created_at)}</span>
        </div>
        ${p.category ? `<div class="mt-1"><span class="tag" style="font-size:10px">${escapeHtml(p.category)}</span></div>` : ''}
      </div>
    `).join('');

    // Pagination
    let pg = '';
    const total = data.pages;
    const cur = data.page;
    if (cur > 1) pg += `<button class="sort-btn" onclick="search(${cur-1})">← Trước</button>`;
    for (let i = Math.max(1, cur-2); i <= Math.min(total, cur+2); i++)
      pg += `<button class="sort-btn ${i===cur?'active':''}" onclick="search(${i})">${i}</button>`;
    if (cur < total) pg += `<button class="sort-btn" onclick="search(${cur+1})">Tiếp →</button>`;
    el('pagination').innerHTML = pg;

  } catch(e) {
    el('proof-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p class="text-red">Lỗi: ${escapeHtml(e.message)}</p></div>`;
  }
}

search();
</script>
</body>
</html>
