<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — FileProof</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topnav">
  <a class="nav-logo" href="/"><div class="nav-pip"></div>FileProof</a>
  <div class="nav-links">
    <a href="/explore.html" class="nav-hide-mobile text-muted text-sm">Explore</a>
    <a href="/create.html" class="btn btn-primary btn-sm">Tạo Proof</a>
    <div id="nav-user" style="display:flex;gap:8px;align-items:center"></div>
    <button class="nav-mobile-menu" id="nav-menu-btn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</nav>

<!-- Loading -->
<div id="col-loading" style="padding:80px;text-align:center;color:var(--muted)">
  <div class="spinner" style="margin:0 auto 14px"></div>Đang tải collection…
</div>

<!-- Content -->
<div id="col-content" style="display:none">
  <div style="border-bottom:1px solid var(--border);padding:18px 20px">
    <div style="max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <span class="badge badge-green" id="col-badge"></span>
        </div>
        <h1 id="col-title" style="font-size:20px;font-weight:500;margin-bottom:5px;word-break:break-word"></h1>
        <p id="col-desc" class="text-muted text-sm"></p>
        <div style="display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap">
          <span><strong id="stat-proofs" style="color:var(--ink)">—</strong> proofs</span>
          <span>Tạo bởi <strong id="col-owner" style="color:var(--ink)"></strong></span>
          <span id="col-date"></span>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="copyColLink()" style="flex-shrink:0">Sao chép link</button>
    </div>
  </div>
  <div id="col-grid" class="proof-grid" style="max-width:unset;min-height:200px"></div>
</div>

<!-- Error -->
<div id="col-error" style="display:none;padding:80px;text-align:center">
  <div style="font-size:40px;margin-bottom:14px">📁</div>
  <div style="font-size:18px;font-weight:500;margin-bottom:8px">Không tìm thấy collection</div>
  <a href="/explore.html" class="btn btn-secondary">← Explore</a>
</div>

<script src="/js/app.js"></script>
<script>
const colId = new URLSearchParams(location.search).get('id');

async function loadCollection() {
  if (!colId) { showErr(); return; }
  try {
    const [col, proofs] = await Promise.all([
      api(`/collections/${colId}`),
      api(`/collections/${colId}/proofs`),
    ]);
    el('col-loading').style.display = 'none';
    el('col-content').style.display = 'block';
    document.title = col.name + ' — FileProof';

    el('col-badge').textContent = col.category || capitalize(col.visibility);
    el('col-title').textContent = col.name;
    el('col-desc').textContent = col.description || '';
    el('stat-proofs').textContent = proofs.length;
    el('col-owner').textContent = col.owner_name || 'Ẩn danh';
    el('col-date').textContent = formatDate(col.created_at);

    if (!proofs.length) {
      el('col-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📭</div><p>Collection này chưa có proof nào.</p></div>`;
      return;
    }
    el('col-grid').innerHTML = proofs.map(p => `
      <div class="proof-grid-item" onclick="location.href='/proof.html?id=${escapeHtml(p.id)}'">
        <div class="proof-thumb">${fileIcon(p.file_type)}</div>
        <div class="proof-thumb-title">${escapeHtml(p.title)}</div>
        <div class="proof-thumb-meta">${escapeHtml(p.file_type?.split('/')[1]||'file')} · ${formatBytes(p.file_size)}</div>
        <div class="mt-1" style="display:flex;align-items:center;justify-content:space-between">
          <span class="badge badge-green" style="font-size:10px"><span class="badge-pip"></span>Verified</span>
          <span class="text-xs text-muted">${timeAgo(p.created_at)}</span>
        </div>
      </div>
    `).join('');
  } catch { showErr(); }
}

function showErr() {
  el('col-loading').style.display = 'none';
  el('col-error').style.display = 'block';
}

function copyColLink() {
  navigator.clipboard.writeText(window.location.href).then(() => toast('Đã sao chép link'));
}

loadCollection();
</script>
</body>
</html>
