<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — FileProof</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<nav class="topnav">
  <a class="nav-logo" href="/"><div class="nav-pip"></div>FileProof</a>
  <div class="nav-links">
    <a href="/explore.html" class="nav-hide-mobile">Explore</a>
    <a href="/create.html" class="btn btn-primary btn-sm">Tạo Proof</a>
    <div id="nav-user" style="display:flex;gap:10px;align-items:center"></div>
  </div>
</nav>

<div id="col-loading" style="padding:80px;text-align:center;color:var(--muted)">
  <div class="spinner" style="width:24px;height:24px;margin:0 auto 12px"></div>Đang tải...
</div>

<div id="col-content" style="display:none">
  <div style="border-bottom:1px solid var(--border);padding:20px 24px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
      <div style="min-width:0">
        <div id="col-badge" class="badge badge-green mb-1" style="width:fit-content"></div>
        <h1 id="col-title" style="font-size:20px;font-weight:500;margin-bottom:6px;word-break:break-word"></h1>
        <p id="col-desc" class="text-muted text-sm"></p>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="copyCollectionLink()" style="flex-shrink:0"><i class="ti ti-copy"></i> Copy link</button>
    </div>
    <div style="display:flex;gap:20px;margin-top:14px;font-size:13px;color:var(--muted);flex-wrap:wrap">
      <span><strong id="stat-proofs" style="color:var(--ink)">—</strong> proofs</span>
      <span>Tạo bởi <strong id="col-owner" style="color:var(--ink)"></strong></span>
      <span id="col-date"></span>
    </div>
  </div>
  <div id="col-grid" class="proof-grid" style="min-height:200px"></div>
</div>

<div id="col-error" style="display:none;padding:80px;text-align:center">
  <div style="font-size:36px;margin-bottom:12px">📁</div>
  <div style="font-size:18px;font-weight:500;margin-bottom:8px">Không tìm thấy collection</div>
  <a href="/explore.html" class="btn btn-secondary">← Explore</a>
</div>

<script src="/js/app.js"></script>
<script>
const colId = new URLSearchParams(location.search).get('id');
async function loadCollection() {
  if (!colId) { showErr(); return; }
  try {
    const [col, proofs] = await Promise.all([api(`/collections/${colId}`), api(`/collections/${colId}/proofs`)]);
    el('col-loading').style.display = 'none';
    el('col-content').style.display = 'block';
    document.title = col.name + ' — FileProof';
    el('col-badge').textContent = col.category || col.visibility;
    el('col-title').textContent = col.name;
    el('col-desc').textContent = col.description || '';
    el('stat-proofs').textContent = proofs.length;
    el('col-owner').textContent = col.owner_name || 'Anonymous';
    el('col-date').textContent = formatDate(col.created_at);
    if (!proofs.length) {
      el('col-grid').innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted);grid-column:1/-1">Collection này chưa có proof nào.</div>`;
      return;
    }
    el('col-grid').innerHTML = proofs.map(p => `
      <div class="proof-grid-item" onclick="location.href='/proof.html?id=${p.id}'">
        <div class="proof-thumb">${fileIcon(p.file_type)}</div>
        <div class="proof-thumb-title">${p.title}</div>
        <div class="proof-thumb-meta">${p.file_type?.split('/')[1]||'file'} · ${formatBytes(p.file_size)}</div>
        <div class="mt-1"><span class="badge badge-green" style="font-size:10px"><span class="badge-pip"></span>Verified</span></div>
      </div>`).join('');
  } catch { showErr(); }
}
function showErr() { el('col-loading').style.display='none'; el('col-error').style.display='block'; }
function copyCollectionLink() { navigator.clipboard.writeText(window.location.href); }
loadCollection();
</script>
</body>
</html>
