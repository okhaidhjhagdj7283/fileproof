<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — FileProof</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topnav">
  <a class="nav-logo" href="/"><div class="nav-pip"></div>FileProof</a>
  <div class="nav-links">
    <a href="/" class="text-muted text-sm">← Trang chủ</a>
  </div>
</nav>

<div class="page-wrap-sm">
  <div class="text-center mb-3">
    <h1 class="serif" style="font-size:28px;margin-bottom:6px" id="page-title">Đăng nhập</h1>
    <p class="text-muted text-sm">FileProof — Preserve · Share · Verify</p>
  </div>

  <!-- Tab switcher -->
  <div style="display:flex;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:22px;overflow:hidden;background:var(--surface)">
    <button id="tab-login" onclick="setTab('login')" style="flex:1;padding:10px;border:none;background:var(--ink);color:var(--paper);font-family:'Geist',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s">Đăng nhập</button>
    <button id="tab-register" onclick="setTab('register')" style="flex:1;padding:10px;border:none;background:transparent;color:var(--muted);font-family:'Geist',sans-serif;font-size:14px;cursor:pointer;transition:all .15s">Đăng ký</button>
  </div>

  <div id="alert-box" style="margin-bottom:12px"></div>

  <!-- Login form -->
  <div id="form-login" class="card">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="l-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <div style="position:relative">
        <input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button type="button" onclick="togglePwd('l-password')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px">👁</button>
      </div>
    </div>
    <button class="btn btn-primary w-full" onclick="doLogin()" id="btn-login">
      <span id="login-spinner" class="spinner spinner-sm" style="display:none"></span>
      Đăng nhập
    </button>
  </div>

  <!-- Register form -->
  <div id="form-register" style="display:none" class="card">
    <div class="form-group">
      <label>Tên hiển thị</label>
      <input type="text" id="r-name" placeholder="Nguyễn Văn A" autocomplete="name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="r-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Mật khẩu <span class="text-muted">(tối thiểu 6 ký tự)</span></label>
      <div style="position:relative">
        <input type="password" id="r-password" placeholder="••••••••" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')doRegister()">
        <button type="button" onclick="togglePwd('r-password')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px">👁</button>
      </div>
    </div>
    <button class="btn btn-accent w-full" onclick="doRegister()" id="btn-register">
      <span id="register-spinner" class="spinner spinner-sm" style="display:none"></span>
      Tạo tài khoản
    </button>
  </div>

  <div class="text-center mt-2">
    <a href="/create.html" class="text-muted text-sm">Tiếp tục không cần đăng nhập →</a>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
function setTab(t) {
  const isLogin = t === 'login';
  el('form-login').style.display = isLogin ? 'block' : 'none';
  el('form-register').style.display = isLogin ? 'none' : 'block';
  el('tab-login').style.cssText = `flex:1;padding:10px;border:none;background:${isLogin ? 'var(--ink)' : 'transparent'};color:${isLogin ? 'var(--paper)' : 'var(--muted)'};font-family:'Geist',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s`;
  el('tab-register').style.cssText = `flex:1;padding:10px;border:none;background:${isLogin ? 'transparent' : 'var(--ink)'};color:${isLogin ? 'var(--muted)' : 'var(--paper)'};font-family:'Geist',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s`;
  el('page-title').textContent = isLogin ? 'Đăng nhập' : 'Tạo tài khoản';
  clearAlert(el('alert-box'));
}

function togglePwd(id) {
  const inp = el(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function doLogin() {
  const email = el('l-email').value.trim();
  const password = el('l-password').value;
  clearAlert(el('alert-box'));
  if (!email || !password) return showAlert(el('alert-box'), 'Vui lòng nhập đầy đủ thông tin.');
  el('btn-login').disabled = true;
  el('login-spinner').style.display = 'inline-block';
  try {
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    setAuth(data.token, data.user);
    const next = new URLSearchParams(location.search).get('next') || '/dashboard.html';
    window.location.href = next;
  } catch(e) {
    showAlert(el('alert-box'), e.message);
    el('btn-login').disabled = false;
    el('login-spinner').style.display = 'none';
  }
}

async function doRegister() {
  const display_name = el('r-name').value.trim();
  const email = el('r-email').value.trim();
  const password = el('r-password').value;
  clearAlert(el('alert-box'));
  if (!email || !password) return showAlert(el('alert-box'), 'Vui lòng nhập email và mật khẩu.');
  if (password.length < 6) return showAlert(el('alert-box'), 'Mật khẩu phải ít nhất 6 ký tự.');
  el('btn-register').disabled = true;
  el('register-spinner').style.display = 'inline-block';
  try {
    const data = await api('/auth/register', { method: 'POST', body: JSON.stringify({ email, password, display_name }) });
    setAuth(data.token, data.user);
    window.location.href = '/dashboard.html';
  } catch(e) {
    showAlert(el('alert-box'), e.message);
    el('btn-register').disabled = false;
    el('register-spinner').style.display = 'none';
  }
}

// Init
const tab = new URLSearchParams(location.search).get('tab');
if (tab === 'register') setTab('register');
if (getUser()) window.location.href = '/dashboard.html';
</script>
</body>
</html>
