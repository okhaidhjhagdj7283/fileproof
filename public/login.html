<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — FileProof</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<nav class="topnav">
  <a class="nav-logo" href="/"><div class="nav-pip"></div>FileProof</a>
</nav>

<div style="max-width:420px;margin:48px auto;padding:0 20px">
  <div style="text-align:center;margin-bottom:28px">
    <h1 style="font-size:24px;font-weight:500;margin-bottom:6px" id="page-title">Đăng nhập</h1>
    <p class="text-muted text-sm">FileProof — Preserve · Share · Verify</p>
  </div>

  <div style="display:flex;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:24px;overflow:hidden">
    <button id="tab-login" onclick="setTab('login')" style="flex:1;padding:10px;border:none;background:var(--ink);color:var(--paper);font-family:'Geist',sans-serif;font-size:14px;cursor:pointer">Đăng nhập</button>
    <button id="tab-register" onclick="setTab('register')" style="flex:1;padding:10px;border:none;background:transparent;color:var(--ink);font-family:'Geist',sans-serif;font-size:14px;cursor:pointer">Đăng ký</button>
  </div>

  <div id="alert-box"></div>

  <div id="form-login">
    <div class="form-group"><label>Email</label><input type="email" id="l-email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="form-group"><label>Mật khẩu</label><input type="password" id="l-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary w-full" onclick="doLogin()" id="btn-login">Đăng nhập</button>
  </div>

  <div id="form-register" style="display:none">
    <div class="form-group"><label>Tên hiển thị</label><input type="text" id="r-name" placeholder="Nguyễn Văn A"></div>
    <div class="form-group"><label>Email</label><input type="email" id="r-email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="form-group"><label>Mật khẩu (tối thiểu 6 ký tự)</label><input type="password" id="r-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doRegister()"></div>
    <button class="btn btn-accent w-full" onclick="doRegister()" id="btn-register">Tạo tài khoản</button>
  </div>

  <div class="text-center mt-3">
    <a href="/create.html" class="text-muted text-sm">Tiếp tục không cần đăng nhập →</a>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
function setTab(t) {
  const isLogin = t === 'login';
  el('form-login').style.display = isLogin ? 'block' : 'none';
  el('form-register').style.display = isLogin ? 'none' : 'block';
  el('tab-login').style.background = isLogin ? 'var(--ink)' : 'transparent';
  el('tab-login').style.color = isLogin ? 'var(--paper)' : 'var(--ink)';
  el('tab-register').style.background = isLogin ? 'transparent' : 'var(--ink)';
  el('tab-register').style.color = isLogin ? 'var(--ink)' : 'var(--paper)';
  el('page-title').textContent = isLogin ? 'Đăng nhập' : 'Tạo tài khoản';
  el('alert-box').innerHTML = '';
}
async function doLogin() {
  const email = el('l-email').value.trim();
  const password = el('l-password').value;
  if (!email || !password) return showAlert(el('alert-box'), 'Vui lòng nhập đầy đủ thông tin.');
  el('btn-login').disabled = true;
  try {
    const data = await api('/users/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    setAuth(data.token, data.user);
    window.location.href = new URLSearchParams(location.search).get('next') || '/dashboard.html';
  } catch(e) { showAlert(el('alert-box'), e.message); el('btn-login').disabled = false; }
}
async function doRegister() {
  const display_name = el('r-name').value.trim();
  const email = el('r-email').value.trim();
  const password = el('r-password').value;
  if (!email || !password) return showAlert(el('alert-box'), 'Vui lòng nhập đầy đủ thông tin.');
  el('btn-register').disabled = true;
  try {
    const data = await api('/users/register', { method: 'POST', body: JSON.stringify({ email, password, display_name }) });
    setAuth(data.token, data.user);
    window.location.href = '/dashboard.html';
  } catch(e) { showAlert(el('alert-box'), e.message); el('btn-register').disabled = false; }
}
const tab = new URLSearchParams(location.search).get('tab');
if (tab === 'register') setTab('register');
if (getUser()) window.location.href = '/dashboard.html';
</script>
</body>
</html>
