<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — FileProof</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="topnav">
  <a class="nav-logo" href="/"><div class="nav-pip"></div>FileProof</a>
  <div class="nav-links">
    <a href="/explore.html">Explore</a>
    <div id="nav-user" style="display:flex;gap:10px;align-items:center"></div>
  </div>
</nav>

<div style="max-width:900px;margin:0 auto;padding:32px 20px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 style="font-size:22px;font-weight:500;">Dashboard</h1>
      <div style="font-size:13px;color:var(--muted);margin-top:3px;">Welcome, <span id="user-name"></span></div>
    </div>
    <a href="/create.html" class="btn btn-primary">+ Create proof</a>
  </div>

  <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;">
    <button id="tab-proofs" class="sort-btn active" onclick="setTab('proofs')" style="border-radius:var(--radius) var(--radius) 0 0;border-bottom:none;padding:10px 18px;">My Proofs</button>
    <button id="tab-collections" class="sort-btn" onclick="setTab('collections')" style="border-radius:var(--radius) var(--radius) 0 0;border-bottom:none;padding:10px 18px;">My Collections</button>
  </div>

  <div id="panel-proofs">
    <div id="my-proofs-list"></div>
  </div>

  <div id="panel-collections" style="display:none;">
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
      <a href="/collection.html" class="btn btn-secondary btn-sm">+ New collection</a>
    </div>
    <div id="my-collections-list"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
