<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — FileProof</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topnav">
  <a class="nav-logo" href="/"><div class="nav-pip"></div>FileProof</a>
  <div class="nav-links">
    <a href="/explore.html" class="nav-hide-mobile text-muted text-sm">Explore</a>
    <a href="/create.html" class="btn btn-primary btn-sm">+ Tạo Proof</a>
    <div id="nav-user" style="display:flex;gap:8px;align-items:center"></div>
    <button class="nav-mobile-menu" id="nav-menu-btn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</nav>

<div class="page-wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="font-size:20px;font-weight:500">Dashboard</h1>
      <div class="text-muted text-sm mt-1">Xin chào, <span id="user-name"></span></div>
    </div>
    <a href="/create.html" class="btn btn-primary">+ Tạo Proof</a>
  </div>

  <!-- Stats row -->
  <div id="stats-row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px">
    <div class="card card-sm text-center">
      <div style="font-size:22px;font-weight:600" id="stat-total">—</div>
      <div class="text-muted text-xs">Tổng proof</div>
    </div>
    <div class="card card-sm text-center">
      <div style="font-size:22px;font-weight:600" id="stat-views">—</div>
      <div class="text-muted text-xs">Lượt xem</div>
    </div>
    <div class="card card-sm text-center">
      <div style="font-size:22px;font-weight:600" id="stat-useful">—</div>
      <div class="text-muted text-xs">Hữu ích</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-row" style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto">
    <button id="tab-proofs" class="sort-btn active" onclick="setTab('proofs')" style="border-radius:var(--radius) var(--radius) 0 0;border-bottom:2px solid var(--accent);padding:10px 18px">Proof của tôi</button>
    <button id="tab-collections" class="sort-btn" onclick="setTab('collections')" style="border-radius:var(--radius) var(--radius) 0 0;border-bottom:2px solid transparent;padding:10px 18px">Collections</button>
  </div>

  <div id="panel-proofs">
    <div id="my-proofs-list"></div>
  </div>
  <div id="panel-collections" style="display:none">
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
      <a href="/collection.html" class="btn btn-secondary btn-sm">+ Collection mới</a>
    </div>
    <div id="my-collections-list"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
